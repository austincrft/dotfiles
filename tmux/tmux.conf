# folke/tokyonight theme colors
# - Background: #24283b
# - Dark background: #1f2335
# - Foreground: #c0caf5
# - Muted foreground: #a9b1d6
# - Blue: #7aa2f7
# - Cyan: #7dcfff
# - Green: #9ece6a
# - Purple: #9d7cd8

# Terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Inactive windows
set -g window-status-format ' #I #{pane_current_path} '


# Selected window
set -g @pill '#1f2335'
set -g @text '#c0caf5'
set -g window-status-current-format ' #[fg=#{@text},bg=#{@pill}] *#I #{pane_current_path} #[default]'


# Optional: keep the window label following the active pane's directory
set -g status-interval 5

